<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Rooftop Management</title>
    <meta
      name="description"
      content="Rooftop Management — 1055 Wilshire Blvd, Suite 2200, Los Angeles, California 90017"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg: #000000;
        --fg: #ffffff;
        --accent: #2ea7ff;

        /* pointer parallax, updated by JS; unitless, eased toward target */
        --px: 0;
        --py: 0;

        /* sequence timing (single source of truth) */
        --t-outer-delay: 0.15s;
        --t-outer-dur: 1s;
        --t-center-delay: 0.6s;
        --t-center-dur: 0.85s;
        --t-drawn: 1.5s; /* icon finished → typography begins */
      }

      * {
        box-sizing: border-box;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: var(--bg);
        color: var(--fg);
        overflow: hidden;
        overscroll-behavior: none;
      }

      body {
        font-family: "Jost", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      }

      .stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(
            ellipse 65% 50% at 50% 46%,
            rgba(46, 167, 255, 0.05) 0%,
            rgba(0, 0, 0, 0) 62%
          ),
          #000;
      }

      .composition {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        user-select: none;
        -webkit-user-select: none;
        transform: translateY(-1.5vh);
      }

      /* ---------------------------------------------------------------- Icon */
      .mark {
        position: relative;
        width: clamp(116px, 13vw, 156px);
        aspect-ratio: 222 / 232;
        margin-bottom: clamp(38px, 6vh, 66px);
      }

      .mark svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        display: block;
      }

      /* pointer-tracked bloom behind the mark */
      .halo {
        position: absolute;
        inset: -32%;
        pointer-events: none;
        background: radial-gradient(
          circle at calc(50% + var(--px) * 14%) calc(46% + var(--py) * 16%),
          rgba(120, 195, 255, 0.22) 0%,
          rgba(46, 167, 255, 0.05) 32%,
          transparent 60%
        );
        filter: blur(6px);
        mix-blend-mode: screen;
        opacity: 0;
        animation: fade-in 1.6s ease 1.5s forwards;
      }

      .stroke {
        fill: none;
        stroke: var(--accent);
        stroke-width: 5;
        stroke-linecap: butt;
        stroke-linejoin: miter;
        stroke-miterlimit: 12;
      }

      /* the two drawn paths use pathLength="1" → dash units normalised to 1 */
      .draw {
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
      }
      .p-outer {
        animation: draw-on var(--t-outer-dur) cubic-bezier(0.65, 0.05, 0.36, 1)
          var(--t-outer-delay) forwards;
      }
      .p-center {
        animation: draw-on var(--t-center-dur) cubic-bezier(0.65, 0.05, 0.36, 1)
          var(--t-center-delay) forwards;
      }

      /* breathing glow — a blurred copy of the strokes, ~10s, almost imperceptible */
      .glow {
        opacity: 0;
        animation: breathe 10s ease-in-out 1.6s infinite;
      }
      .glow .stroke {
        stroke-width: 7;
        opacity: 0.6;
      }

      /* polished-metal face; fades in after the draw, drifts with the pointer */
      .gloss {
        opacity: 0;
        mix-blend-mode: screen;
        transform: translate(calc(var(--px) * 3px), calc(var(--py) * 2px));
        animation: fade-in 1.4s ease 1.4s forwards;
      }

      /* specular sweep travelling across the mark every ~24s */
      .sheen {
        opacity: 0;
        animation: sheen 24s ease-in-out 5s infinite;
      }

      /* ------------------------------------------------------- Typography */
      /* lockup width is defined by the wordmark; the submark row stretches to it */
      .lockup {
        width: fit-content;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .wordmark {
        margin: 0;
        font-weight: 300;
        font-size: clamp(40px, 5.2vw, 72px);
        line-height: 1;
        letter-spacing: 0.3em;
        color: var(--fg);
        padding-left: 0.3em;
        white-space: nowrap;
        opacity: 0;
        animation: rise-in 1.2s cubic-bezier(0.22, 0.61, 0.36, 1) var(--t-drawn)
          forwards;
      }

      .submark-row {
        margin-top: clamp(15px, 2.2vh, 22px);
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .divider {
        flex: 0 0 auto;
        width: clamp(26px, 3.4vw, 44px);
        height: 1px;
        background: var(--accent);
        transform: scaleX(0);
        transform-origin: center;
        opacity: 0;
        animation: grow-x 0.9s cubic-bezier(0.65, 0.05, 0.36, 1)
          calc(var(--t-drawn) + 0.35s) forwards;
      }

      .submark {
        flex: 0 0 auto;
        font-weight: 400;
        font-size: clamp(9px, 0.92vw, 12px);
        letter-spacing: 0.5em;
        color: var(--accent);
        padding-left: 0.5em;
        white-space: nowrap;
        opacity: 0;
        animation: rise-in 1.1s cubic-bezier(0.22, 0.61, 0.36, 1)
          calc(var(--t-drawn) + 0.3s) forwards;
      }

      .address {
        margin-top: clamp(48px, 8vh, 86px);
        text-align: center;
        font-family: "Jost", sans-serif;
        font-weight: 300;
        font-size: clamp(9px, 0.82vw, 11.5px);
        line-height: 2.05;
        letter-spacing: 0.2em;
        color: rgba(255, 255, 255, 0.72);
        padding-left: 0.2em;
        font-style: normal;
        opacity: 0;
        animation: fade-up 1.4s cubic-bezier(0.22, 0.61, 0.36, 1)
          calc(var(--t-drawn) + 0.95s) forwards;
      }

      .address .tick {
        display: block;
        width: 30px;
        height: 1px;
        background: var(--accent);
        opacity: 0.85;
        margin: 0 auto clamp(22px, 3.4vh, 32px);
        transform: scaleX(0);
        animation: grow-x 0.8s cubic-bezier(0.65, 0.05, 0.36, 1)
          calc(var(--t-drawn) + 1.05s) forwards;
      }

      /* ----------------------------------------------------------- Keyframes */
      @keyframes draw-on {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes fade-in {
        to {
          opacity: 1;
        }
      }
      @keyframes rise-in {
        from {
          opacity: 0;
          filter: blur(12px);
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          filter: blur(0);
          transform: translateY(0);
        }
      }
      @keyframes fade-up {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes grow-x {
        to {
          transform: scaleX(1);
          opacity: 0.9;
        }
      }
      @keyframes breathe {
        0%,
        100% {
          opacity: 0.3;
        }
        50% {
          opacity: 0.62;
        }
      }
      /* one short sweep, then a long rest, per 24s cycle */
      @keyframes sheen {
        0% {
          transform: translateX(-150px) skewX(-16deg);
          opacity: 0;
        }
        2% {
          opacity: 0;
        }
        6% {
          opacity: 0.9;
        }
        10.5% {
          transform: translateX(250px) skewX(-16deg);
          opacity: 0;
        }
        100% {
          transform: translateX(250px) skewX(-16deg);
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .draw {
          stroke-dashoffset: 0;
        }
        .halo,
        .gloss,
        .wordmark,
        .submark,
        .address {
          opacity: 1;
          filter: none;
          transform: none;
        }
        .divider,
        .address .tick {
          transform: scaleX(1);
          opacity: 0.9;
        }
        .p-outer,
        .p-center,
        .glow,
        .sheen,
        .wordmark,
        .submark,
        .address,
        .divider,
        .tick,
        .halo,
        .gloss {
          animation: none !important;
        }
      }
    </style>
  </head>

  <body>
    <main class="stage">
      <div class="composition">
        <div class="mark">
          <div class="halo" aria-hidden="true"></div>
          <svg viewBox="0 0 222 232" role="img" aria-label="Rooftop Management">
            <defs>
              <linearGradient id="gloss-grad" x1="0.1" y1="0" x2="0.4" y2="1">
                <stop offset="0" stop-color="#9bd4ff" stop-opacity="0.42" />
                <stop offset="0.45" stop-color="#2ea7ff" stop-opacity="0.14" />
                <stop offset="1" stop-color="#2ea7ff" stop-opacity="0" />
              </linearGradient>
              <linearGradient id="sheen-grad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#fff" stop-opacity="0" />
                <stop offset="0.5" stop-color="#fff" stop-opacity="0.85" />
                <stop offset="1" stop-color="#fff" stop-opacity="0" />
              </linearGradient>
              <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
                <feGaussianBlur stdDeviation="2.4" />
                <feComponentTransfer>
                  <feFuncA type="linear" slope="0.85" />
                </feComponentTransfer>
              </filter>
              <clipPath id="mark-clip">
                <path d="M3 231 L3 73 L111 1 L219 73 L219 231" fill="none" stroke="#fff" stroke-width="10" />
                <path d="M111 231 L111 1" fill="none" stroke="#fff" stroke-width="10" />
                <path d="M111 4 L160 36 L171 56 L150 96 L111 110 Z" fill="#fff" />
              </clipPath>
            </defs>

            <!-- breathing glow -->
            <g class="glow" filter="url(#glow)" aria-hidden="true">
              <path class="stroke" d="M3 231 L3 73 L111 1 L219 73 L219 231" />
              <path class="stroke" d="M111 231 L111 1" />
            </g>

            <!-- polished-metal lit face -->
            <path
              class="gloss"
              d="M111 4 L160 36 L171 56 L150 96 L111 110 Z"
              fill="url(#gloss-grad)"
            />

            <!-- drawn strokes -->
            <path
              class="stroke draw p-outer"
              pathLength="1"
              d="M3 231 L3 73 L111 1 L219 73 L219 231"
            />
            <path
              class="stroke draw p-center"
              pathLength="1"
              d="M111 231 L111 1"
            />

            <!-- specular sweep -->
            <g clip-path="url(#mark-clip)">
              <rect
                class="sheen"
                x="0"
                y="-20"
                width="58"
                height="280"
                fill="url(#sheen-grad)"
              />
            </g>
          </svg>
        </div>

        <div class="lockup">
          <h1 class="wordmark">ROOFTOP</h1>

          <div class="submark-row">
            <span class="divider"></span>
            <span class="submark">MANAGEMENT</span>
            <span class="divider"></span>
          </div>
        </div>

        <address class="address">
          <span class="tick"></span>
          1055 WILSHIRE BLVD, SUITE 2200<br />
          LOS ANGELES, CALIFORNIA 90017
        </address>
      </div>
    </main>

    <script>
      // Pointer parallax — eases two unitless CSS vars toward the cursor so the
      // highlight grazes the mark like light on polished metal (~1–2% shift).
      (function () {
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        var root = document.documentElement;
        var tx = 0, ty = 0, cx = 0, cy = 0, raf = null;
        function onMove(e) {
          tx = e.clientX / window.innerWidth - 0.5;
          ty = e.clientY / window.innerHeight - 0.5;
          if (!raf) raf = requestAnimationFrame(loop);
        }
        function loop() {
          cx += (tx - cx) * 0.06;
          cy += (ty - cy) * 0.06;
          root.style.setProperty("--px", cx.toFixed(4));
          root.style.setProperty("--py", cy.toFixed(4));
          if (Math.abs(tx - cx) > 0.0005 || Math.abs(ty - cy) > 0.0005) {
            raf = requestAnimationFrame(loop);
          } else {
            raf = null;
          }
        }
        window.addEventListener("pointermove", onMove, { passive: true });
      })();
    </script>
  </body>
</html>
